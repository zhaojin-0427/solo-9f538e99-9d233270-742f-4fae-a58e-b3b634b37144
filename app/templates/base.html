<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}双端 FASTQ 配对修复{% endblock %}</title>
  <style>
    :root { --ok:#15803d; --bad:#b91c1c; --run:#1d4ed8; --wait:#a16207; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; background: #f4f5f7; color: #1f2933; }
    header { background: #16324f; color: #fff; padding: 14px 24px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header .sub { font-size: 12px; opacity: .75; margin-top: 2px; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 20px; margin-bottom: 20px; }
    .card h2 { margin: 0 0 14px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef2f6;
             vertical-align: middle; }
    th { color: #64748b; font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
             font-size: 12px; font-weight: 600; white-space: nowrap; }
    .st-done       { background: #dcfce7; color: var(--ok); }
    .st-failed     { background: #fee2e2; color: var(--bad); }
    .st-processing { background: #dbeafe; color: var(--run); }
    .st-queued     { background: #fef9c3; color: var(--wait); }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .btn { display: inline-block; padding: 6px 14px; border-radius: 6px; border: 1px solid #cbd5e1;
           background: #fff; color: #1f2933; text-decoration: none; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: #16324f; border-color: #16324f; color: #fff; }
    .btn-primary:hover { background: #1f4468; }
    .btn[disabled] { opacity: .45; pointer-events: none; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    .flash.error { background: #fee2e2; color: var(--bad); }
    .muted { color: #64748b; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .err { background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d;
           padding: 10px 12px; border-radius: 6px; font-size: 13px; word-break: break-all; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 16px; font-size: 14px; }
    .kv dt { color: #64748b; } .kv dd { margin: 0; }
    .dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
               gap: 10px; margin-top: 8px; }
    .dl-item { border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; }
    .dl-item .name { font-size: 13px; margin-bottom: 8px; }
    input[type=file] { font-size: 13px; }
    .form-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  </style>
</head>
<body>
<header>
  <h1>双端 FASTQ 配对修复台</h1>
  <div class="sub">乱序读段重排配对 · 缺端记录分离 · 全量校验，整批成败</div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
